repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: ^(external/|.*\.dic$|.*\.aff$)
      - id: end-of-file-fixer
        exclude: ^(external/|.*\.dic$|.*\.aff$)
      - id: check-json
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: '\.bat$'

  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        exclude: ^external/

  - repo: local
    hooks:
      - id: pylint
        name: pylint
        entry: pylint
        language: python
        additional_dependencies: [pylint]
        types: [python]
        files: ^(main|filter|style|bake_defaults)\.py$
        args:
          - --errors-only
          - --fail-on=E
